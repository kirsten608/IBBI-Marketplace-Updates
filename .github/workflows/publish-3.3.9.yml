name: Publish 3.3.9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer
        run: |
          curl -fL --retry 5 --retry-delay 3 -o IBBI_Marketplace_Tool_Setup_3.3.9.exe "https://tmpfiles.org/dl/1788898023.61b3d71d5388f8dd/wwwC45Ivazf7/ibbi_marketplace_tool_setup_3.3.9.exe"
          echo "8745c3a5b61cb3d0305b9b62a0c131388973a063ba2622200b5f8e84ff86bed6  IBBI_Marketplace_Tool_Setup_3.3.9.exe" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.3.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v3.3.9 --repo "$GITHUB_REPOSITORY" --title "IBBI Marketplace Tool 3.3.9" --notes "UI consistency hotfix: Settings now correctly shows bundled IBBI Marketplace Extension 7.2.7.17. No publish-engine behavior was changed from the verified 3.3.8 build."
          gh release upload v3.3.9 IBBI_Marketplace_Tool_Setup_3.3.9.exe --repo "$GITHUB_REPOSITORY" --clobber
