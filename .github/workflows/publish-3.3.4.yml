name: Publish 3.3.4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download final installer
        run: |
          curl -fL --retry 5 --retry-delay 3 -o IBBI_Marketplace_Tool_Setup_3.3.4.exe "https://tmpfiles.org/dl/1788789634.a9c9b950a530a782/wtwJ47ZFwGNU/ibbi_marketplace_tool_setup_3.3.4.exe"
          echo "90add8d3fdb4485d974cc4fec7b79537d540b756babe6df092d1842d0234991c  IBBI_Marketplace_Tool_Setup_3.3.4.exe" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.3.4 --repo kirsten608/IBBI-Marketplace-Updates >/dev/null 2>&1 || gh release create v3.3.4 --repo kirsten608/IBBI-Marketplace-Updates --title "IBBI Marketplace Tool 3.3.4" --notes "Final approved client update: latest Open All Profiles, profile selection stability, delete saved drafts recovery, and background Publish Listing fixes."
          gh release upload v3.3.4 IBBI_Marketplace_Tool_Setup_3.3.4.exe --repo kirsten608/IBBI-Marketplace-Updates --clobber
