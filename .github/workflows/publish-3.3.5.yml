name: Publish 3.3.5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer
        run: |
          curl -fL --retry 5 --retry-delay 3 -o IBBI_Marketplace_Tool_Setup_3.3.5.exe "https://tmpfiles.org/dl/1788791742.683a4d51780946d3/w7w14LZzSXnc/ibbi_marketplace_tool_setup_3.3.5.exe"
          echo "2231619a7a991fc27c3e0f78eb99ff062224bce7504ff7c81e6ad8d825c95fad  IBBI_Marketplace_Tool_Setup_3.3.5.exe" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.3.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v3.3.5 --repo "$GITHUB_REPOSITORY" --title "IBBI Marketplace Tool 3.3.5" --notes "Hotfix: Auto Pilot Save Draft profile selection restored and verified in packaged build. Includes automatic extension sync/reload on extension version update."
          gh release upload v3.3.5 IBBI_Marketplace_Tool_Setup_3.3.5.exe --repo "$GITHUB_REPOSITORY" --clobber
