name: Publish 3.3.10

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer
        run: |
          curl -fL --retry 5 --retry-delay 3 -o IBBI_Marketplace_Tool_Setup_3.3.10.exe "https://tmpfiles.org/dl/1788900746.c98c73f6cd44f77a/wywx46FfLo99/ibbi_marketplace_tool_setup_3.3.10.exe"
          echo "572e2c8e13ced85215029a9364d6bb2b3b97ee50b32c36f9220bbfbcc3b23351  IBBI_Marketplace_Tool_Setup_3.3.10.exe" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.3.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v3.3.10 --repo "$GITHUB_REPOSITORY" --title "IBBI Marketplace Tool 3.3.10" --notes "Updater progress UI only: shows percent, downloaded MB / total MB, download speed, remaining time, verification state and installer-start state. No Save Draft, Publish Listing, Auto Pilot, Scheduler, Seller Tools, profile, extension-worker or other feature logic was changed."
          gh release upload v3.3.10 IBBI_Marketplace_Tool_Setup_3.3.10.exe --repo "$GITHUB_REPOSITORY" --clobber
